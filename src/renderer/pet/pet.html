<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskLLMPet</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <!-- 桌宠主体容器：窗口只显示动画中间一块（裁剪），气泡由独立窗口负责 -->
  <div id="pet-container">
    <!-- 动画播放区域（尺寸 = 窗口 / 裁剪比例，超出部分被容器裁掉） -->
    <video
      id="pet-video"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
    ></video>

    <!-- 右键菜单 -->
    <div id="context-menu" class="hidden">
      <div class="menu-item" data-action="balance">
        <span class="menu-icon">💰</span>
        <span>查看 API 余额</span>
      </div>
      <!-- 插件贡献的菜单项（无插件时保持为空，不影响原有菜单） -->
      <div id="plugin-menu-items" class="hidden"></div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="settings">
        <span class="menu-icon">⚙️</span>
        <span>设置</span>
      </div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="hide">
        <span class="menu-icon">👁️</span>
        <span>隐藏桌宠</span>
      </div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="quit">
        <span class="menu-icon">🚪</span>
        <span>退出</span>
      </div>
    </div>
  </div>

  <script src="pet.js"></script>
</body>
</html>

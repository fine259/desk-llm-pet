<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskLLMPet</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <!-- 桌宠主体容器 -->
  <div id="pet-container">
    <!-- 动画播放区域 -->
    <video
      id="pet-video"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
    ></video>

    <!-- 提示气泡 -->
    <div id="speech-bubble" class="hidden">
      <span id="bubble-text"></span>
    </div>

    <!-- 右键菜单 -->
    <div id="context-menu" class="hidden">
      <div class="menu-item" data-action="chat">
        <span class="menu-icon">💬</span>
        <span>AI 对话</span>
      </div>
      <div class="menu-item" data-action="settings">
        <span class="menu-icon">⚙️</span>
        <span>设置</span>
      </div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="hide">
        <span class="menu-icon">👁️</span>
        <span>隐藏桌宠</span>
      </div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="quit">
        <span class="menu-icon">🚪</span>
        <span>退出</span>
      </div>
    </div>

    <!-- 状态指示器 -->
    <div id="status-indicator" class="hidden">
      <div class="status-dot"></div>
    </div>
  </div>

  <script src="pet.js"></script>
</body>
</html>
